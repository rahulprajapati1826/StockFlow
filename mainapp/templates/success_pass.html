{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Success | StockFlow</title>

    <link rel="stylesheet" href="{% static 'src/output.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">

    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="mb-7 text-center">

            <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 text-3xl text-white shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>

            <h1 class="text-3xl font-extrabold tracking-tight text-slate-800">
                Stock<span class="text-indigo-600">Flow</span>
            </h1>

            <p class="mt-2 text-sm text-slate-500">
                Inventory Management System
            </p>

        </div>

        <!-- Success Card -->
        <div class="rounded-2xl border border-slate-200 bg-white px-7 py-10 text-center shadow-xl shadow-slate-200/60">

            <!-- Success Icon -->
            <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-emerald-50 text-4xl text-emerald-500">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h2 class="text-2xl font-extrabold text-slate-800">
                Success!
            </h2>

            <p class="mt-4 rounded-xl border border-emerald-100 bg-emerald-50 px-4 py-4 text-sm font-semibold leading-relaxed text-emerald-700">
                {{ message }}
            </p>

            <p class="mt-5 text-sm text-slate-500">
                You can now login using your account credentials.
            </p>

            <!-- Login Button -->
            <a href="{% url 'login-user' %}"
               class="mt-7 flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-6 py-3.5 text-sm font-bold text-white shadow-lg shadow-indigo-200 transition hover:-translate-y-0.5 hover:shadow-xl">

                <i class="fa-solid fa-right-to-bracket"></i>
                Back to Login

            </a>

        </div>

        <!-- Footer -->
        <p class="mt-7 text-center text-xs text-slate-400">
            © {% now "Y" %} StockFlow. All rights reserved.
        </p>

    </div>

</body>
</html>
